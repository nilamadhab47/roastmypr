<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoastMyPR</title>
  <style>
    :root {
      --bg: #070708;
      --surface: #0d0d10;
      --elevated: #141418;
      --border: rgba(255,255,255,0.08);
      --text: #f5f7fa;
      --muted: #8b949e;
      --red: #ff4d4d;
      --green: #39ff88;
      --orange: #e16f3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      width: 340px;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #141418 0%, var(--bg) 100%);
    }

    .brand {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .tagline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12.5px;
    }

    .tagline em {
      color: var(--text);
      font-style: normal;
      font-weight: 600;
    }

    .content { padding: 14px 16px 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .meter {
      height: 8px;
      border-radius: 999px;
      background: #1a1a22;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--green), #22c55e);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .meter span.low {
      background: linear-gradient(90deg, var(--orange), var(--red));
    }

    .usage-text {
      font-size: 13px;
      font-weight: 700;
    }

    .usage-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      color: var(--text);
    }

    .btn + .btn { margin-top: 8px; }

    .btn-primary {
      background: var(--red);
      color: #fff;
    }

    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: 0.55; cursor: default; filter: none; }

    .btn-ghost {
      background: var(--elevated);
      border-color: var(--border);
      color: var(--text);
      font-weight: 600;
    }

    .btn-ghost:hover { border-color: rgba(255,255,255,0.16); }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .row .btn { margin-top: 0; }

    .loading, .error {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
    }

    .foot {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    .foot a {
      color: var(--muted);
      text-decoration: none;
    }

    .foot a:hover { color: var(--text); }

    .notice h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .user-row img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .user-row strong { display: block; font-size: 13px; }
    .user-row span { color: var(--muted); font-size: 11px; }
    .btn-google { background: #fff; color: #1f1f1f; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🔥 RoastMyPR</div>
    <p class="tagline">Claude writes the roast. <em>Jev scores it.</em><br>GitHub has not forgiven us.</p>
  </div>

  <div class="content">
    <div class="loading" id="loading">Warming up the roast engine…</div>

    <div id="main-content" style="display: none;">
      <div class="card notice" id="no-key-card" style="display: none;">
        <h3>Sign in to roast</h3>
        <button class="btn btn-google" id="google-btn">Continue with Google</button>
      </div>

      <div class="card" id="user-card" style="display: none;">
        <div class="user-row">
          <img id="user-pic" alt="" width="36" height="36">
          <div>
            <strong id="user-name">You</strong>
            <span id="user-personality">Savage</span>
          </div>
        </div>
      </div>

      <div class="card" id="usage-card" style="display: none;">
        <div class="label">Roasts remaining</div>
        <div class="meter"><span id="usage-fill"></span></div>
        <div class="usage-text" id="usage-text">—</div>
        <div class="usage-sub">Resets hourly · not a real SLA</div>
      </div>

      <div class="card">
        <div class="label">This month</div>
        <div class="stat-row">
          <div class="stat-value" id="reviews-count">0</div>
          <div class="usage-sub" id="damage-label">PRs emotionally damaged</div>
        </div>
      </div>

      <button class="btn btn-primary" id="open-panel-btn">🔥 Roast a PR</button>
      <div class="row">
        <a class="btn btn-ghost" id="site-btn" href="https://roastmypr.xyz" target="_blank" rel="noopener noreferrer">🌐 roastmypr.xyz</a>
        <button class="btn btn-ghost" id="options-btn">⚙ Settings</button>
      </div>

      <p class="foot">
        Jev-checked comedy for git diff · <span id="version">v1.0.4</span>
      </p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
